name: Profile dashboard

# Rebuilds the activity dashboard SVGs from the GitHub GraphQL API and
# publishes them to the `output` branch, which README.md links to.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the generators
        run: npm test

      - name: Build the dashboard
        run: node scripts/build-dashboard.mjs --login "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch=output
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Update profile dashboard"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output

      # GitHub pauses scheduled workflows in repositories without recent commits.
      # Re-enabling the workflow through the API keeps the daily refresh running.
      - name: Keep the schedule active
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/dashboard.yml/enable"
