<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Let’s build something useful.</title>
<desc id="desc">Thoughtful interfaces, practical systems, and products that work. kuraimos.com</desc>
<style>@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:800;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:600;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}.f-display{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800}.f-heading{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700}.f-label{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:600}.f-body{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.d1{animation-delay:0.07s}.d2{animation-delay:0.14s}.d3{animation-delay:0.21s}.d4{animation-delay:0.28s}.d5{animation-delay:0.35s}.d6{animation-delay:0.42s}.d7{animation-delay:0.49s}.d8{animation-delay:0.56s}.d9{animation-delay:0.63s}.d10{animation-delay:0.70s}.d11{animation-delay:0.77s}.d12{animation-delay:0.84s}.d13{animation-delay:0.91s}.d14{animation-delay:0.98s}.d15{animation-delay:1.05s}.d16{animation-delay:1.12s}
.static{display:none}
.pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}80%,100%{opacity:0;transform:scale(3.2)}}
.drift-a,.drift-b,.drift-c{transform-box:fill-box;transform-origin:center}
.drift-a{animation:drift-a 18s ease-in-out infinite alternate}
.drift-b{animation:drift-b 23s ease-in-out infinite alternate}
.drift-c{animation:drift-c 27s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate(-34px,16px) scale(1.1)}}
@keyframes drift-b{to{transform:translate(30px,-14px) scale(1.08)}}
@keyframes drift-c{to{transform:translate(-20px,-18px) scale(1.12)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(25deg)}}
.wave-0{animation:wave-0 14s linear infinite}@keyframes wave-0{to{transform:translateX(-240px)}}
.wave-1{animation:wave-1 9s linear infinite}@keyframes wave-1{to{transform:translateX(-160px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.static{display:inline}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17161F"/><stop offset="1" stop-color="#1D1B29"/></linearGradient><clipPath id="frame"><rect width="480" height="250" rx="28"/></clipPath><radialGradient id="blob0"><stop stop-color="#6A5CC4" stop-opacity="0.3"/><stop offset=".6" stop-color="#6A5CC4" stop-opacity="0.14"/><stop offset="1" stop-color="#6A5CC4" stop-opacity="0"/></radialGradient><radialGradient id="blob1"><stop stop-color="#3E8A70" stop-opacity="0.3"/><stop offset=".6" stop-color="#3E8A70" stop-opacity="0.14"/><stop offset="1" stop-color="#3E8A70" stop-opacity="0"/></radialGradient><radialGradient id="blob2"><stop stop-color="#9A6450" stop-opacity="0.3"/><stop offset=".6" stop-color="#9A6450" stop-opacity="0.14"/><stop offset="1" stop-color="#9A6450" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#frame)">
<rect width="480" height="250" fill="url(#bg)"/>
<ellipse class="drift-a" cx="60" cy="40" rx="200" ry="140" fill="url(#blob0)"/>
<ellipse class="drift-c" cx="430" cy="50" rx="180" ry="130" fill="url(#blob1)"/>
<ellipse class="drift-b" cx="240" cy="280" rx="260" ry="120" fill="url(#blob2)"/>
<path class="twinkle" style="animation-delay:0s" d="M52 63Q52 70 59 70Q52 70 52 77Q52 70 45 70Q52 70 52 63Z" fill="#CBC3FF" fill-opacity=".55"/>
<path class="twinkle" style="animation-delay:1.4s" d="M430 58Q430 66 438 66Q430 66 430 74Q430 66 422 66Q430 66 430 58Z" fill="#F3BDA2" fill-opacity=".55"/>
<path class="wave-0" d="M0 224Q60 218 120 224Q180 230 240 224Q300 218 360 224Q420 230 480 224Q540 218 600 224Q660 230 720 224V250H0Z" fill="#6A5CC4" fill-opacity="0.32"/>
<path class="wave-1" d="M0 236Q40 229 80 236Q120 243 160 236Q200 229 240 236Q280 243 320 236Q360 229 400 236Q440 243 480 236Q520 229 560 236Q600 243 640 236V250H0Z" fill="#9A6450" fill-opacity="0.32"/>
<text class="f-display rise d1" x="240" y="84" font-size="25" letter-spacing="-1" fill="#EFEDF8" text-anchor="middle">Let’s build something useful<tspan fill="#B5AAFF">.</tspan></text>
<g class="rise d2"><text class="f-body" x="240" y="116" font-size="15" fill="#A39FB9" text-anchor="middle">Thoughtful interfaces. Practical systems.</text><text class="f-body" x="240" y="138" font-size="15" fill="#A39FB9" text-anchor="middle">Products that work.</text></g>
<g class="rise d3"><rect x="170.34" y="160" width="139.31" height="32" rx="16" fill="#2B2844"/><g transform="translate(183.34 168.5) scale(0.83)" fill="none" stroke="#CBC3FF" color="#CBC3FF" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7.2"/><ellipse cx="9" cy="9" rx="3.1" ry="7.2"/><path d="M1.8 9h14.4"/></g><text class="f-label" x="205.34" y="180.55" font-size="13" fill="#CBC3FF">kuraimos.com</text></g>
</g>
<rect x=".5" y=".5" width="479" height="249" rx="27.5" stroke="#322F45"/>
</svg>
