<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Let’s build something useful.</title>
<desc id="desc">Thoughtful interfaces, practical systems, and products that work. kuraimos.com</desc>
<style>@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:800;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:600;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}.f-display{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800}.f-heading{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700}.f-label{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:600}.f-body{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.d1{animation-delay:0.07s}.d2{animation-delay:0.14s}.d3{animation-delay:0.21s}.d4{animation-delay:0.28s}.d5{animation-delay:0.35s}.d6{animation-delay:0.42s}.d7{animation-delay:0.49s}.d8{animation-delay:0.56s}.d9{animation-delay:0.63s}.d10{animation-delay:0.70s}.d11{animation-delay:0.77s}.d12{animation-delay:0.84s}.d13{animation-delay:0.91s}.d14{animation-delay:0.98s}.d15{animation-delay:1.05s}.d16{animation-delay:1.12s}
.static{display:none}
.pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}80%,100%{opacity:0;transform:scale(3.2)}}
.drift-a,.drift-b,.drift-c{transform-box:fill-box;transform-origin:center}
.drift-a{animation:drift-a 18s ease-in-out infinite alternate}
.drift-b{animation:drift-b 23s ease-in-out infinite alternate}
.drift-c{animation:drift-c 27s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate(-34px,16px) scale(1.1)}}
@keyframes drift-b{to{transform:translate(30px,-14px) scale(1.08)}}
@keyframes drift-c{to{transform:translate(-20px,-18px) scale(1.12)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.6) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(25deg)}}
.wave-0{animation:wave-0 14s linear infinite}@keyframes wave-0{to{transform:translateX(-320px)}}
.wave-1{animation:wave-1 9s linear infinite}@keyframes wave-1{to{transform:translateX(-220px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.static{display:inline}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17161F"/><stop offset="1" stop-color="#1D1B29"/></linearGradient><clipPath id="frame"><rect width="960" height="220" rx="28"/></clipPath><radialGradient id="blob0"><stop stop-color="#6A5CC4" stop-opacity="0.3"/><stop offset=".6" stop-color="#6A5CC4" stop-opacity="0.14"/><stop offset="1" stop-color="#6A5CC4" stop-opacity="0"/></radialGradient><radialGradient id="blob1"><stop stop-color="#3E8A70" stop-opacity="0.3"/><stop offset=".6" stop-color="#3E8A70" stop-opacity="0.14"/><stop offset="1" stop-color="#3E8A70" stop-opacity="0"/></radialGradient><radialGradient id="blob2"><stop stop-color="#9A6450" stop-opacity="0.3"/><stop offset=".6" stop-color="#9A6450" stop-opacity="0.14"/><stop offset="1" stop-color="#9A6450" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#frame)">
<rect width="960" height="220" fill="url(#bg)"/>
<ellipse class="drift-a" cx="120" cy="40" rx="260" ry="160" fill="url(#blob0)"/>
<ellipse class="drift-c" cx="860" cy="50" rx="240" ry="150" fill="url(#blob1)"/>
<ellipse class="drift-b" cx="480" cy="250" rx="360" ry="140" fill="url(#blob2)"/>
<path class="twinkle" style="animation-delay:0s" d="M224 62Q224 70 232 70Q224 70 224 78Q224 70 216 70Q224 70 224 62Z" fill="#CBC3FF" fill-opacity=".55"/>
<path class="twinkle" style="animation-delay:1.4s" d="M744 54Q744 64 754 64Q744 64 744 74Q744 64 734 64Q744 64 744 54Z" fill="#F3BDA2" fill-opacity=".55"/>
<path class="twinkle" style="animation-delay:0.7s" d="M862 135Q862 140 867 140Q862 140 862 145Q862 140 857 140Q862 140 862 135Z" fill="#9EDFC5" fill-opacity=".55"/>
<path class="wave-0" d="M0 194Q80 188 160 194Q240 200 320 194Q400 188 480 194Q560 200 640 194Q720 188 800 194Q880 200 960 194Q1040 188 1120 194Q1200 200 1280 194V220H0Z" fill="#6A5CC4" fill-opacity="0.32"/>
<path class="wave-1" d="M0 206Q55 199 110 206Q165 213 220 206Q275 199 330 206Q385 213 440 206Q495 199 550 206Q605 213 660 206Q715 199 770 206Q825 213 880 206Q935 199 990 206Q1045 213 1100 206Q1155 199 1210 206Q1265 213 1320 206V220H0Z" fill="#9A6450" fill-opacity="0.32"/>
<text class="f-display rise d1" x="480" y="90" font-size="34" letter-spacing="-1" fill="#EFEDF8" text-anchor="middle">Let’s build something useful<tspan fill="#B5AAFF">.</tspan></text>
<g class="rise d2"><text class="f-body" x="480" y="122" font-size="16.5" fill="#A39FB9" text-anchor="middle">Thoughtful interfaces · practical systems · products that work.</text></g>
