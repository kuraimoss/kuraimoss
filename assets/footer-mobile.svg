<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Let’s build something useful.</title>
<desc id="desc">Thoughtful interfaces, practical systems, and products that work. kuraimos.com</desc>
<style>@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:800;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}.f-display{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800}.f-heading{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700}.f-body{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:500}.f-mono{font-family:'JetBrains Mono',ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-weight:500}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.d1{animation-delay:0.07s}.d2{animation-delay:0.14s}.d3{animation-delay:0.21s}.d4{animation-delay:0.28s}.d5{animation-delay:0.35s}.d6{animation-delay:0.42s}.d7{animation-delay:0.49s}.d8{animation-delay:0.56s}.d9{animation-delay:0.63s}.d10{animation-delay:0.70s}.d11{animation-delay:0.77s}.d12{animation-delay:0.84s}.d13{animation-delay:0.91s}.d14{animation-delay:0.98s}.d15{animation-delay:1.05s}.d16{animation-delay:1.12s}
.static{display:none}
.pulse{transform-box:fill-box;transform-origin:center;opacity:0;animation:pulse 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}80%,100%{opacity:0;transform:scale(3.2)}}
.drift-a{transform-box:fill-box;transform-origin:center;animation:drift-a 16s ease-in-out infinite alternate}
.drift-b{transform-box:fill-box;transform-origin:center;animation:drift-b 21s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate(-44px,22px) scale(1.12)}}
@keyframes drift-b{to{transform:translate(36px,-18px) scale(1.08)}}
.glint{animation:glint 9s cubic-bezier(.45,0,.55,1) 1.4s infinite}@keyframes glint{0%{transform:translateX(0)}45%,100%{transform:translateX(700px)}}
.wave-a{animation:wave-a 14s linear infinite}@keyframes wave-a{to{transform:translateX(-240px)}}
.wave-b{animation:wave-b 9s linear infinite}@keyframes wave-b{to{transform:translateX(-160px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.static{display:inline}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="480" y2="236" gradientUnits="userSpaceOnUse"><stop stop-color="#0D0B18"/><stop offset=".55" stop-color="#110D20"/><stop offset="1" stop-color="#1A1231"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#C4B5FD" stroke-opacity=".07"/></pattern><radialGradient id="gridFade" cx=".7" cy=".3" r=".85"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="gridMask"><rect width="480" height="236" fill="url(#gridFade)"/></mask><linearGradient id="edge"><stop stop-color="#C4B5FD" stop-opacity="0"/><stop offset=".5" stop-color="#C4B5FD" stop-opacity=".9"/><stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/></linearGradient><clipPath id="frame"><rect width="480" height="236" rx="20"/></clipPath><radialGradient id="glow0"><stop stop-color="#8B6CFF" stop-opacity="0.3"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></radialGradient><linearGradient id="name" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3C8FF"/></linearGradient></defs>
<g clip-path="url(#frame)">
<rect width="480" height="236" fill="url(#bg)"/>
<ellipse class="drift-a" cx="240" cy="266" rx="264" ry="170" fill="url(#glow0)"/>
<rect width="480" height="236" fill="url(#grid)" mask="url(#gridMask)"/>
<rect class="glint" x="-220" y="0" width="220" height="1.5" fill="url(#edge)"/>
<path class="wave-a" d="M0 206Q60 200 120 206Q180 212 240 206Q300 200 360 206Q420 212 480 206Q540 200 600 206Q660 212 720 206V236H0Z" fill="#A78BFA" fill-opacity="0.12"/>
<path class="wave-b" d="M0 218Q40 211 80 218Q120 225 160 218Q200 211 240 218Q280 225 320 218Q360 211 400 218Q440 225 480 218Q520 211 560 218Q600 225 640 218V236H0Z" fill="#8B6CFF" fill-opacity="0.16"/>
<text class="f-display rise d1" x="240" y="82" font-size="25" letter-spacing="-1" fill="url(#name)" text-anchor="middle">Let’s build something useful<tspan fill="#A78BFA">.</tspan></text>
<g class="rise d2"><text class="f-body" x="240" y="116" font-size="15" fill="#BDB5D6" text-anchor="middle">Thoughtful interfaces. Practical systems.</text><text class="f-body" x="240" y="138" font-size="15" fill="#BDB5D6" text-anchor="middle">Products that work.</text></g>
<text class="f-mono rise d3" x="240" y="174" font-size="12.5" letter-spacing="1.6" fill="#C4B5FD" text-anchor="middle">KURAIMOS.COM ↗</text>
</g>
<rect x=".5" y=".5" width="479" height="235" rx="19.5" stroke="#3B2F63"/>
