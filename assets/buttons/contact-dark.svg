<style>@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:700;font-display:block;src:url(data:font/woff2;base64,) format('woff2')}.f-display{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800}.f-heading{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:700}.f-label{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:600}.f-body{font-family:'Plus Jakarta Sans','Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:500}
